<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Convocatorias Jalisco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="bg-jalisco-circle me-2">
                    <i class="bi bi-person-fill text-white"></i>
                </div>
                <span class="fw-bold text-jalisco">Cultura</span>
            </a>
            
            <div class="mx-auto d-none d-md-block" style="width: 40%;">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <small class="text-muted">Buscador</small> <i class="bi bi-search ms-2"></i>
                    </span>
                    <input type="text" class="form-control border-start-0" placeholder="Explorar Contenido">
                    <button class="btn btn-jalisco text-white px-4" type="button">Buscar</button>
                </div>
            </div>

            <div class="d-flex align-items-center">
                <div class="me-3 text-end d-none d-sm-block">
                    <small class="d-block fw-bold" style="font-size: 0.75rem;">AL ESTILO</small>
                    <small class="text-muted">Jalisco</small>
                </div>
                <a href="login.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-house-door me-2"></i>
            <h3 class="fw-bold mb-0">Convocatorias</h3>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100 border-0 shadow-sm card-convocatoria">
                    <div class="card-body text-center p-5">
                        <div class="mb-4">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Logo_del_Gobierno_de_Jalisco.svg/1200px-Logo_del_Gobierno_de_Jalisco.svg.png" 
                                 alt="Jalisco Logo" class="grayscale-logo" style="width: 80px;">
                            <p class="text-muted small mt-2 mb-0">JALISCO</p>
                            <p class="text-muted x-small">GOBIERNO DEL ESTADO</p>
                        </div>
                        <h5 class="text-jalisco fw-bold mb-0">Convocatorias activas</h5>
                        <a href="#" class="stretched-link"></a>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 border-0 shadow-sm card-convocatoria">
                    <div class="card-body text-center p-5">
                        <div class="mb-4">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Logo_del_Gobierno_de_Jalisco.svg/1200px-Logo_del_Gobierno_de_Jalisco.svg.png" 
                                 alt="Jalisco Logo" class="grayscale-logo" style="width: 80px;">
                            <p class="text-muted small mt-2 mb-0">JALISCO</p>
                            <p class="text-muted x-small">GOBIERNO DEL ESTADO</p>
                        </div>
                        <h5 class="text-jalisco fw-bold mb-0">Convocatorias cerradas</h5>
                        <a href="#" class="stretched-link"></a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
