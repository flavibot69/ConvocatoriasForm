<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Ciudadano - Jalisco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <div class="container-fluid vh-100">
        <div class="row h-100">
            <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center bg-white border-end">
                <img src="https://cdnimg.bnamericas.com/QpIVRBwxnFOdkXQOUDgZznOgXvRFHBBKGpNtGIFBYtxMLkTTzAovHgBnMXootHUk.png" 
                     alt="Logo Jalisco" class="img-fluid mb-4" style="max-width: 350px;">
                <p class="text-muted fw-bold">Gobierno de Jalisco</p>
            </div>

            <div class="col-md-6 d-flex align-items-center justify-content-center bg-white">
                <div class="login-box w-75">
                    <h2 class="fw-bold mb-1">Crea tu cuenta</h2>
                    <p class="text-muted mb-4">Completa tus datos para participar en las convocatorias</p>

                    <form id="registroForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" placeholder="Ej. Juan Pérez" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Número de Teléfono</label>
                            <input type="tel" class="form-control" placeholder="33 1234 5678" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Municipio de residencia</label>
                            <select id="registroMunicipio" class="form-select" required>
                                <option value="" selected disabled>Selecciona tu municipio</option>
                                <option value="1">Guadalajara</option>
                                <option value="2">Zapopan</option>
                                <option value="3">Tlaquepaque</option>
                                <option value="4">Tlajomulco</option>
                                <option value="5">Tonalá</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Crea una Contraseña</label>
                            <input type="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="terminos" required>
                            <label class="form-check-label small" for="terminos">
                                Acepto los <a href="#" class="text-jalisco">términos y condiciones</a> y el aviso de privacidad.
                            </label>
                        </div>

                        <button type="submit" class="btn btn-jalisco w-100 py-2 fw-bold text-white mb-3">
                            Finalizar Registro
                        </button>

                        <div class="text-center">
                            <p class="small">¿Ya tienes cuenta? <a href="login.html" class="text-jalisco fw-bold text-decoration-none">Inicia sesión aquí</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/registro.js"></script>
</body>
</html>
