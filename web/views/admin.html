<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Jalisco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
                <div class="text-center mb-4">
                    <img src="https://administracion.jalisco.gob.mx/assets/images/logos/logo_jal_meta_2024_2030.png" class="img-fluid" style="max-width: 120px;">
                </div>
                <div class="nav flex-column">
                    <a href="#" class="nav-link-admin active"><i class="bi bi-grid-fill me-2"></i> Dashboard</a>
                    <a href="#" onclick="cerrarSesion()" class="nav-link-admin text-danger"><i class="bi bi-box-arrow-right me-2"></i> Salir</a>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <h1 class="h2 fw-bold text-jalisco">Gestión de Convocatorias</h1>
                    <button class="btn btn-jalisco text-white" data-bs-toggle="modal" data-bs-target="#modalConvocatoria">Nueva Convocatoria</button>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr><th>Título</th><th>Estado</th><th>Inscritos</th><th class="text-end">Acciones</th></tr>
                            </thead>
                            <tbody id="tabla-admin-convocatorias"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalConvocatoria" tabindex="-1">
        <div class="modal-dialog">
            <form id="formNuevaConvocatoria" class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Nueva Convocatoria</h5></div>
                <div class="modal-body">
                    <input type="text" id="title" class="form-control mb-3" placeholder="Título" required>
                    <input type="date" id="date" class="form-control" required>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-jalisco text-white w-100">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
