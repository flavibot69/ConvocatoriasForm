<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Ciudadano - Jalisco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <div class="container-fluid vh-100">
        <div class="row h-100">
            <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center bg-white border-end">
                <img src="https://administracion.jalisco.gob.mx/assets/images/logos/logo_jal_meta_2024_2030.png" 
                     alt="Logo Jalisco" class="img-fluid mb-4" style="max-width: 350px;">
                <p class="text-muted fw-bold">Gobierno de Jalisco</p>
            </div>

            <div class="col-md-6 d-flex align-items-center justify-content-center bg-white">
                <div class="login-box w-75">
                    <h2 class="fw-bold mb-1">Acceso Ciudadano</h2>
                    <p class="text-muted mb-4">Ingresa tus datos para continuar</p>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" placeholder="Juan Pérez" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" placeholder="correo@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Número de Teléfono</label>
                            <input type="tel" class="form-control" placeholder="555-1234-5678" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Municipio</label>
                            <select class="form-select" required>
                                <option value="" selected disabled>Selecciona tu municipio</option>
                                <option value="guadalajara">Guadalajara</option>
                                <option value="zapopan">Zapopan</option>
                                <option value="tlaquepaque">Tlaquepaque</option>
                                <option value="tonala">Tonalá</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="aviso" required>
                            <label class="form-check-label small" for="aviso">
                                Acepto el <a href="#" class="text-jalisco">aviso de privacidad</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-jalisco w-100 py-2 fw-bold text-white mb-3">
                            Registrarse o Iniciar Sesión
                        </button>
                        <div class="text-center mt-3">
                            <p class="small">¿Aún no tienes cuenta? 
                                <a href="registro.html" class="text-jalisco fw-bold text-decoration-none">Crea una aquí</a>
                            </p>
                        </div>

                        <div class="text-center">
                            <a href="#" class="small text-muted text-decoration-none">Need help? Contact support</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
